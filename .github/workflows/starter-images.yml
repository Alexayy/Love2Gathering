name: Optional Starter image pack

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-starter-images:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Alexayy/Love2Gathering' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out only the parent repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify the recorded XMage pin without initializing it
        run: python3 scripts/check-submodule-pin.py --head "$GITHUB_SHA" --index

      - name: Prepare the disposable runner's test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3 python3-yaml ca-certificates
          mkdir -p build/ci/starter-image-reports

      - name: Check optional pack completeness and workflow guards
        run: python3 scripts/ci/test_starter_images.py -v 2>&1 | tee build/ci/starter-image-reports/tests.log

      # Match the installer workflow's metadata provider/type. Metadata and its
      # provenance are verified; no developer SQL cache is read or uploaded.
      - name: Acquire verified default card metadata
        run: python3 scripts/ci/prepare-metadata.py --output build/ci/cards.jsonl --report build/ci/cards.provenance.json --bulk-type default_cards

      - name: Build all twenty Starters into a separate optional image ZIP
        run: |
          python3 scripts/ci/prepare-starter-images.py \
            --source build/ci/cards.jsonl \
            --metadata-report build/ci/cards.provenance.json \
            --work build/ci/starter-image-work \
            --output dist/optional-images/Love2Gathering-starter-images.zip \
            --report dist/optional-images/starter-images.provenance.json \
            --bulk-type default_cards \
            --full-size normal 2>&1 | tee build/ci/starter-image-reports/build.log

      - name: Recheck the unchanged parent engine pin
        run: python3 scripts/check-submodule-pin.py --head "$GITHUB_SHA" --index

      - name: Keep the complete optional image pack and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: starter-images-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/optional-images/Love2Gathering-starter-images.zip
            dist/optional-images/SHA256SUMS
            dist/optional-images/starter-images.provenance.json
            build/ci/cards.provenance.json

      - name: Keep compact diagnostics even when acquisition fails
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: starter-image-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: build/ci/starter-image-reports/
